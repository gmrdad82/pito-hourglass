app = "pito-hourglass"
bin = "demo"
grid = [30, 10]
frame = "bare"

[build]
command = "cargo build --release --locked --example demo"
bin_dir = "{target}/release/examples"

[theme]
name = "hourglass"
background = "#141821"
foreground = "#e3e7ef"
cursor = "#92a6d9"
selection = "#334054"
black = "#141821"
red = "#d9603b"
green = "#91b79a"
yellow = "#d6b078"
blue = "#6f86d6"
magenta = "#c38bd9"
cyan = "#82abb8"
white = "#e3e7ef"
brightBlack = "#7a8699"
brightRed = "#e88668"
brightGreen = "#afd4b7"
brightYellow = "#f0ca91"
brightBlue = "#9aaceb"
brightMagenta = "#dcadf0"
brightCyan = "#a8cfda"
brightWhite = "#ffffff"

[shots.demo]
kind = "clip"
line = "The README's example: the glass drains and flips while its label shimmers"
tape = "render/terminal/demo.tape"
launch = "demo"
settle = "1500ms"
