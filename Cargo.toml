[package]
name = "pito-hourglass"
version = "0.1.3"
edition = "2024"
description = "A HEY-style hourglass for ratatui apps to show while data loads, with a label that shimmers in the app's accent"
license = "MIT"
authors = ["Gamer Dad"]
repository = "https://github.com/gmrdad82/pito-hourglass"
publish = false

[lib]
name = "pito_hourglass"

[dependencies]
ratatui = { version = "0.30", default-features = false }
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
